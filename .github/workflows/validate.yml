name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate skill files and shared rules
        run: |
          set -euo pipefail

          for file in \
            skills/onekey-market/SKILL.md \
            skills/onekey-security/SKILL.md \
            skills/onekey-swap/SKILL.md \
            skills/onekey-wallet/SKILL.md \
            skills/onekey-market/references/common.md \
            skills/onekey-security/references/common.md \
            skills/onekey-swap/references/common.md \
            skills/onekey-wallet/references/common.md \
            skills/onekey-market/references/examples.md \
            skills/onekey-security/references/examples.md \
            skills/onekey-swap/references/examples.md \
            skills/onekey-wallet/references/examples.md; do
            [ -s "$file" ]
          done

          for file in \
            skills/onekey-market/SKILL.md \
            skills/onekey-security/SKILL.md \
            skills/onekey-swap/SKILL.md \
            skills/onekey-wallet/SKILL.md; do
            head -n 5 "$file" | grep -q '^---$'
            head -n 5 "$file" | grep -q '^name:'
            grep -q 'references/common.md' "$file"
            grep -q 'references/examples.md' "$file"
          done

          cmp -s skills/onekey-wallet/references/common.md skills/onekey-swap/references/common.md
          cmp -s skills/onekey-wallet/references/common.md skills/onekey-market/references/common.md
          cmp -s skills/onekey-wallet/references/common.md skills/onekey-security/references/common.md

          cmp -s skills/onekey-wallet/references/examples.md skills/onekey-swap/references/examples.md
          cmp -s skills/onekey-wallet/references/examples.md skills/onekey-market/references/examples.md
          cmp -s skills/onekey-wallet/references/examples.md skills/onekey-security/references/examples.md

          common=skills/onekey-wallet/references/common.md
          for pattern in \
            'version' \
            'version --json' \
            '@onekeyfe/cli' \
            'status' \
            'logout' \
            'App Transport' \
            'appTransfer' \
            'hardware' \
            'passphraseMode' \
            'device-search' \
            'schema bug' \
            'addressType' \
            'fromAddressType' \
            'signOnly' \
            'Solana' \
            'SPL' \
            'swap-execute' \
            'swap-networks'; do
            grep -Fq -- "$pattern" "$common"
          done

          examples=skills/onekey-wallet/references/examples.md
          for pattern in \
            'Route: auth-login' \
            'Route: wallet-address' \
            'using App Transport' \
            'Fields: appTransfer=true' \
            'passphraseMode=on_device' \
            'Device authenticity verification:' \
            'Route: device-toggle-passphrase' \
            'Route: device-change-pin' \
            'Route: device-settings' \
            'Device security confirmation:' \
            'Route: device-verify blocked until schema is available' \
            'Fields: chain=btc, asset=BTC, amount=0.01, addressType=taproot' \
            'Execute fields after confirmation: order=<orderId>, fromAddressType=taproot, signOnly=true' \
            'Route context: sourceChain=sol, destinationChain=eth' \
            'Route: token-trending' \
            'Route: no EVM security-audit for Solana mint unless schema exposes Solana audit'; do
            grep -Fq -- "$pattern" "$examples"
          done

          grep -Fq 'App Transfer/App Transport Bot Wallet' skills/onekey-wallet/SKILL.md
          grep -Fq 'hardware wallet' skills/onekey-wallet/SKILL.md
          grep -Fq 'BTC/Solana addresses' skills/onekey-wallet/SKILL.md
          grep -Fq 'sign a BTC PSBT' skills/onekey-swap/SKILL.md
          grep -Fq 'swap SOL/SPL' skills/onekey-swap/SKILL.md
          grep -Fq 'BTC metrics' skills/onekey-market/SKILL.md
          grep -Fq 'Solana/SPL token info' skills/onekey-market/SKILL.md
          grep -Fq 'App Transfer/App Transport Bot Wallet secret safety' skills/onekey-security/SKILL.md
          grep -Fq 'hardware wallet safety' skills/onekey-security/SKILL.md

  validate-repo-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate top-level docs exist
        run: |
          set -euo pipefail
          for file in AGENTS.md CLAUDE.md CONTRIBUTING.md README.md; do
            [ -s "$file" ]
          done

  validate-plugin-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin manifest JSON
        run: |
          set -euo pipefail
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .cursor-plugin/plugin.json >/dev/null
          python -m json.tool .opencode/opencode.json >/dev/null

      - name: Validate platform install docs exist
        run: |
          set -euo pipefail
          for file in \
            .codex/INSTALL.md \
            .opencode/INSTALL.md \
            .openclaw/INSTALL.md; do
            [ -s "$file" ]
          done
