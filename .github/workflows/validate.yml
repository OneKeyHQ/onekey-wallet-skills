name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate skill files and shared rules
        run: |
          set -euo pipefail

          for file in \
            skills/onekey-market/SKILL.md \
            skills/onekey-security/SKILL.md \
            skills/onekey-swap/SKILL.md \
            skills/onekey-wallet/SKILL.md \
            skills/onekey-market/references/common.md \
            skills/onekey-security/references/common.md \
            skills/onekey-swap/references/common.md \
            skills/onekey-wallet/references/common.md; do
            [ -s "$file" ]
          done

          for file in \
            skills/onekey-market/SKILL.md \
            skills/onekey-security/SKILL.md \
            skills/onekey-swap/SKILL.md \
            skills/onekey-wallet/SKILL.md; do
            head -n 5 "$file" | grep -q '^---$'
            head -n 5 "$file" | grep -q '^name:'
          done

  validate-repo-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate top-level docs exist
        run: |
          set -euo pipefail
          for file in AGENTS.md CLAUDE.md CONTRIBUTING.md README.md; do
            [ -s "$file" ]
          done

  validate-plugin-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin manifest JSON
        run: |
          set -euo pipefail
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .cursor-plugin/plugin.json >/dev/null
          python -m json.tool .opencode/opencode.json >/dev/null

      - name: Validate platform install docs exist
        run: |
          set -euo pipefail
          for file in \
            .codex/INSTALL.md \
            .opencode/INSTALL.md \
            .openclaw/INSTALL.md; do
            [ -s "$file" ]
          done
